name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job name stable: branch protection on `main` requires the "check" status.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check (app + API)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:run

      # PGlite, no network. Includes api/__tests__/migrations.test.ts, which fails
      # when src/lib/db/schema.ts changes without a generated migration.
      - name: API tests
        run: npm run test:api

      - name: Build
        run: npm run build

  # End-to-end journey in a real browser (roadmap 3.3). Runs the app in dev-bypass mode
  # (scripts/e2e-server.mjs) against a throwaway, in-memory Postgres (PGlite) served through
  # scripts/neon-http-emulator.mjs, which speaks Neon's HTTP protocol. So it needs NO database
  # account and NO repository secret, never touches a shared database, and runs for fork PRs too.
  # The emulator applies the real migrations in ./drizzle when it starts.
  # Deliberately a separate job from `check`: add it to branch protection once it is stable.
  e2e:
    # Pinned: Playwright's browser install doesn't support the newest ubuntu-latest image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Only a label: the host is the machine itself and the emulator ignores the credentials.
      E2E_DATABASE_URL: postgres://e2e:e2e@127.0.0.1/e2e
      NEON_HTTP_ENDPOINT: http://127.0.0.1:4444/sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the local e2e database
        run: |
          node scripts/neon-http-emulator.mjs --port 4444 > emulator.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4444/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4444/health || { echo "::error::the local e2e database did not start"; cat emulator.log; exit 1; }

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            emulator.log
          retention-days: 7
